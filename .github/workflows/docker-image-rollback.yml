name: Docker Image Deployment and Rollback Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application before Docker deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (must pass before deployment)
        run: python -m pytest -q

  deploy-and-rollback:
    name: Deploy two Docker images and roll back
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare previous source revision
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_SHA="$(git rev-parse HEAD^)"
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "previous=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$RUNNER_TEMP/tidewater-previous" "$PREVIOUS_SHA"
          echo "Previous commit: $PREVIOUS_SHA"
          echo "Current commit:  $CURRENT_SHA"

      - name: Build and tag previous and current Docker images
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.revisions.outputs.previous }}
          CURRENT_SHA: ${{ steps.revisions.outputs.current }}
        run: |
          set -euo pipefail
          docker build --build-arg "APP_VERSION=$PREVIOUS_SHA" -t "tidewater-tours:$PREVIOUS_SHA" "$RUNNER_TEMP/tidewater-previous"
          docker build --build-arg "APP_VERSION=$CURRENT_SHA" -t "tidewater-tours:$CURRENT_SHA" .
          docker image ls tidewater-tours

      - name: Deploy previous image, update to current, then roll back
        shell: bash
        env:
          PREVIOUS_SHA: ${{ steps.revisions.outputs.previous }}
          CURRENT_SHA: ${{ steps.revisions.outputs.current }}
        run: |
          set -euo pipefail
          trap 'docker rm -f tidewater-live tidewater-preflight >/dev/null 2>&1 || true' EXIT

          health_check() {
            local expected="$1"
            local url="$2"
            local response
            for attempt in $(seq 1 20); do
              if response="$(curl --fail --silent --show-error --max-time 3 "$url")"; then
                if RESPONSE="$response" EXPECTED="$expected" python -c 'import json,os; d=json.loads(os.environ["RESPONSE"]); assert d["status"]=="ok" and d["version"]==os.environ["EXPECTED"]'; then
                  echo "Health check passed: $response"
                  return 0
                fi
              fi
              sleep 2
            done
            echo "::error::Unhealthy Docker container; expected version $expected"
            docker logs tidewater-live || true
            docker logs tidewater-preflight || true
            return 1
          }

          echo "::group::1. Deploy previous Docker image"
          docker run -d --name tidewater-live -p 127.0.0.1:18080:8000 "tidewater-tours:$PREVIOUS_SHA"
          health_check "$PREVIOUS_SHA" "http://127.0.0.1:18080/health"
          echo "Running image: $(docker inspect --format '{{.Config.Image}}' tidewater-live)"
          echo "::endgroup::"

          echo "::group::2. Preflight newer Docker image and deploy it"
          docker run -d --name tidewater-preflight -p 127.0.0.1:18081:8000 "tidewater-tours:$CURRENT_SHA"
          health_check "$CURRENT_SHA" "http://127.0.0.1:18081/health"
          docker rm -f tidewater-preflight
          docker rm -f tidewater-live
          docker run -d --name tidewater-live -p 127.0.0.1:18080:8000 "tidewater-tours:$CURRENT_SHA"
          health_check "$CURRENT_SHA" "http://127.0.0.1:18080/health"
          echo "Running image: $(docker inspect --format '{{.Config.Image}}' tidewater-live)"
          echo "::endgroup::"

          echo "::group::3. One-step rollback to previous Docker image"
          docker rm -f tidewater-live
          docker run -d --name tidewater-live -p 127.0.0.1:18080:8000 "tidewater-tours:$PREVIOUS_SHA"
          health_check "$PREVIOUS_SHA" "http://127.0.0.1:18080/health"
          FINAL_IMAGE="$(docker inspect --format '{{.Config.Image}}' tidewater-live)"
          test "$FINAL_IMAGE" = "tidewater-tours:$PREVIOUS_SHA"
          echo "ROLLBACK VERIFIED: $FINAL_IMAGE is now running and healthy"
          echo "::endgroup::"

          {
            echo "## Docker container deployment and rollback proof"
            echo "- Previous commit Docker image: `tidewater-tours:$PREVIOUS_SHA`"
            echo "- Current commit Docker image: `tidewater-tours:$CURRENT_SHA`"
            echo "- Docker deployment v1 and health check: passed"
            echo "- Docker deployment v2 and health check: passed"
            echo "- Docker rollback to previous image and health check: passed"
            echo "- **Limitation:** These containers run on a temporary GitHub Actions runner, not in LocalStack or a persistent, coach-approved server."
          } >> "$GITHUB_STEP_SUMMARY"
