name: LocalStack Hobby - Flask Lambda Deploy and Rollback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.py
      - lambda_handler.py
      - requirements.txt
      - requirements-dev.txt
      - tests/**
      - scripts/localstack_hobby_deploy.sh
      - .github/workflows/localstack-hobby.yml

permissions:
  contents: read

jobs:
  test:
    name: Test Flask API and Lambda adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (failure must block deployment)
        run: python -m pytest -q

  deploy-localstack:
    name: Deploy Lambda, health-check, and roll back
    runs-on: ubuntu-latest
    needs: test
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check LocalStack CI token is configured
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "::error::Missing LOCALSTACK_AUTH_TOKEN in GitHub Actions secrets"
            exit 1
          fi
      - name: Install the LocalStack CLI
        run: npm install -g @localstack/lstk
      - name: Configure LocalStack AWS CLI profile
        run: lstk setup aws
      - name: Start LocalStack emulator
        run: lstk start
      - name: Deploy API and demonstrate Lambda version rollback
        run: bash scripts/localstack_hobby_deploy.sh
      - name: LocalStack diagnostics on failure
        if: failure()
        run: lstk logs --verbose || true
